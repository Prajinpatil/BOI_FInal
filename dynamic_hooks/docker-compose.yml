# NIRIKSHAK-AI :: Dynamic Sandbox — Docker Compose Service Definition
# =====================================================================
#
# Purpose  : Provision a complete, isolated dynamic analysis sandbox
#            composed of:
#              • MobSF  — primary Android dynamic analysis engine
#              • mitmproxy  — transparent HTTPS interception & PCAP export
#              • Frida-server relay  — ADB-over-TCP bridge for Frida hooks
#              • MongoDB  — MobSF report persistence
#              • Redis  — inter-service event queue
#              • Nginx reverse-proxy  — single external entry point
#
# Usage
# -----
#   Start full sandbox:
#       docker compose -f dynamic_hooks/docker-compose.yml up -d
#
#   Tail all service logs:
#       docker compose -f dynamic_hooks/docker-compose.yml logs -f
#
#   Attach Frida to a running app (after sandbox is up):
#       frida -H 127.0.0.1:27042 -f com.target.app -l anti_evasion.js --no-pause
#
#   Run a full analysis pipeline:
#       python dynamic_analyzer.py /data/reports/latest.json /data/pcap/capture.pcap
#
#   Stop and clean up volumes:
#       docker compose -f dynamic_hooks/docker-compose.yml down -v
#
# Port Map (host → container)
# ----------------------------
#   8000  →  MobSF web UI
#   8008  →  MobSF REST API
#   8080  →  mitmproxy web UI
#   8081  →  mitmproxy transparent proxy (HTTP)
#   8443  →  mitmproxy transparent proxy (HTTPS)
#   27042 →  Frida gadget / server port (ADB forwarded)
#   27017 →  MongoDB
#   6379  →  Redis
#   9090  →  Nginx reverse proxy (aggregate UI entry point)
#
# Security Notes
# --------------
#   • This compose file is designed for an ISOLATED, air-gapped analysis lab.
#   • NEVER expose these services to a public network without authentication.
#   • The MOBSF_API_KEY should be rotated before each analysis session.
#   • All volumes are local-bind mounts for easy PCAP / report extraction.
#
# Author  : NIRIKSHAK-AI — Member B
# Version : 2.0.0
# Updated : 2026-08-14

version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# NAMED VOLUMES
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  mobsf_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./sandbox_volumes/mobsf_data

  mongodb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./sandbox_volumes/mongodb_data

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./sandbox_volumes/redis_data

  pcap_output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./sandbox_volumes/pcap_output

  reports_output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./sandbox_volumes/reports

  mitmproxy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./sandbox_volumes/mitmproxy_data

# ═══════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  sandbox_net:
    driver: bridge

  dmz_net:
    driver: bridge

# ═══════════════════════════════════════════════════════════════════════════════
# SERVICES
# ═══════════════════════════════════════════════════════════════════════════════
services:

  # ─── MongoDB — MobSF report & analysis data persistence ────────────────────
  mongodb:
    image: mongo:6.0-jammy
    container_name: nirikshak_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nirikshak
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nirikshak_secure_2026}
      MONGO_INITDB_DATABASE: nirikshak_dynamic
    volumes:
      - mongodb_data:/data/db
      - ./sandbox_configs/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - sandbox_net
    ports:
      - "127.0.0.1:27017:27017"    # Bind to localhost only
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis — event bus / scan queue for inter-service communication ─────────
  redis:
    image: redis:7.2-alpine
    container_name: nirikshak_redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-nirikshak_redis_2026}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 300 1
        --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sandbox_net
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nirikshak_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ─── MobSF — Mobile Security Framework (dynamic analysis engine) ────────────
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: nirikshak_mobsf
    restart: unless-stopped
    privileged: true               # Required for ADB and dynamic analysis
    environment:
      # ── Core settings ────────────────────────────────────────────────────────
      MOBSF_ANALYZER_IDENTIFIER: ${EMULATOR_ADB_SERIAL:-emulator-5554}
      MOBSF_API_KEY: ${MOBSF_API_KEY:-nirikshak_mobsf_key_2026_changeme}
      # ── Database backend — use MongoDB ───────────────────────────────────────
      MOBSF_USE_MONGO: "true"
      MONGO_URI: mongodb://nirikshak:${MONGO_PASSWORD:-nirikshak_secure_2026}@mongodb:27017/nirikshak_dynamic?authSource=admin
      # ── Proxy settings — route through mitmproxy ─────────────────────────────
      HTTP_PROXY:  "http://mitmproxy:8081"
      HTTPS_PROXY: "http://mitmproxy:8081"
      NO_PROXY:    "localhost,127.0.0.1,mongodb,redis"
      # ── Analysis environment tweaks ───────────────────────────────────────────
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: ${MOBSF_UI_PASSWORD:-nirikshak_admin_2026}
      DJANGO_SUPERUSER_EMAIL:    admin@nirikshak.local
    volumes:
      - mobsf_data:/home/mobsf/.MobSF
      - reports_output:/home/mobsf/.MobSF/uploads
      # Mount our custom Frida script so MobSF can auto-inject it
      - ./anti_evasion.js:/home/mobsf/.MobSF/scripts/anti_evasion.js:ro
    networks:
      - sandbox_net
    ports:
      - "8000:8000"    # MobSF web UI
      - "8008:8008"    # MobSF REST API
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/login/ || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 90s          # MobSF takes time to initialize DB schemas
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── mitmproxy — Transparent HTTPS interception & PCAP export ──────────────
  #
  # Intercepts all sandbox traffic, generates PCAP-compatible flow dumps, and
  # exposes a web UI for manual inspection.  The dynamic_analyzer.py module
  # reads the PCAP from pcap_output/ on the host.
  mitmproxy:
    image: mitmproxy/mitmproxy:10.1.5
    container_name: nirikshak_mitmproxy
    restart: unless-stopped
    command: >
      mitmweb
        --web-host 0.0.0.0
        --web-port 8080
        --listen-host 0.0.0.0
        --listen-port 8081
        --ssl-insecure
        --set hardump=/pcap/capture.pcapng
        --set confdir=/home/mitmproxy/.mitmproxy
        --set stream_large_bodies=5m
        --set connection_strategy=lazy
    volumes:
      - pcap_output:/pcap
      - mitmproxy_data:/home/mitmproxy/.mitmproxy
      - ./sandbox_configs/mitmproxy_addon.py:/home/mitmproxy/mitmproxy_addon.py:ro
    networks:
      - sandbox_net
      - dmz_net
    ports:
      - "8080:8080"    # mitmproxy web UI
      - "8081:8081"    # HTTP transparent proxy
      - "8443:8443"    # HTTPS transparent proxy (SSL strip)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ─── Frida Relay — ADB-over-TCP bridge to Android emulator ─────────────────
  #
  # This lightweight sidecar runs adb in TCP mode and keeps frida-server
  # alive on the connected emulator/device. The Frida client on the host
  # connects to 127.0.0.1:27042 to attach scripts.
  frida_relay:
    image: nirikshak/frida-relay:16.3.3    # Custom image; build from ./sandbox_configs/Dockerfile.frida
    build:
      context: ./sandbox_configs
      dockerfile: Dockerfile.frida
    container_name: nirikshak_frida_relay
    restart: unless-stopped
    privileged: true
    environment:
      ADB_SERIAL:          ${EMULATOR_ADB_SERIAL:-emulator-5554}
      ADB_TCP_PORT:        5555
      FRIDA_SERVER_PORT:   27042
      FRIDA_SERVER_PATH:   /data/local/tmp/frida-server
      ANTI_EVASION_SCRIPT: /scripts/anti_evasion.js
      TARGET_PACKAGE:      ${TARGET_PACKAGE:-com.target.app}
    volumes:
      - ./anti_evasion.js:/scripts/anti_evasion.js:ro
      - ./sandbox_configs/frida_relay_entrypoint.sh:/entrypoint.sh:ro
    networks:
      - sandbox_net
    ports:
      - "127.0.0.1:27042:27042"   # Frida gadget port — localhost only
      - "127.0.0.1:5555:5555"     # ADB TCP port — localhost only
    depends_on:
      - mobsf
    healthcheck:
      test: ["CMD-SHELL", "frida-ps -H 127.0.0.1:27042 2>/dev/null | grep -q 'zygote' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Analysis Worker — runs dynamic_analyzer.py after each MobSF scan ───────
  #
  # Polls Redis for completed scan events, downloads the MobSF JSON report,
  # runs dynamic_analyzer.evaluate_dynamic_telemetry(), and posts the result
  # back to the main NIRIKSHAK backend via HTTP.
  analysis_worker:
    image: python:3.11-slim-bookworm
    container_name: nirikshak_analysis_worker
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install -q scapy redis requests && python worker.py"
    environment:
      MOBSF_HOST:     http://mobsf:8000
      MOBSF_API_KEY:  ${MOBSF_API_KEY:-nirikshak_mobsf_key_2026_changeme}
      REDIS_HOST:     redis
      REDIS_PORT:     "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nirikshak_redis_2026}
      REDIS_QUEUE:    nirikshak:scan_complete
      BACKEND_URL:    ${NIRIKSHAK_BACKEND_URL:-http://host.docker.internal:8001}
      PCAP_DIR:       /pcap
      REPORTS_DIR:    /reports
    volumes:
      - ./dynamic_analyzer.py:/app/dynamic_analyzer.py:ro
      - ./sandbox_configs/worker.py:/app/worker.py:ro
      - pcap_output:/pcap:ro
      - reports_output:/reports:ro
    networks:
      - sandbox_net
    depends_on:
      mobsf:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─── Nginx reverse proxy — single external entry point ──────────────────────
  #
  # Routes:
  #   /         →  MobSF web UI          (port 8000)
  #   /api/     →  MobSF REST API        (port 8008)
  #   /proxy/   →  mitmproxy web UI      (port 8080)
  #   /metrics/ →  Prometheus-compatible JSON status endpoint (custom)
  nginx:
    image: nginx:1.25-alpine
    container_name: nirikshak_nginx
    restart: unless-stopped
    volumes:
      - ./sandbox_configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sandbox_configs/nginx_default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sandbox_net
      - dmz_net
    ports:
      - "9090:9090"    # Aggregate entry point for all sandbox UIs
    depends_on:
      mobsf:
        condition: service_healthy
      mitmproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -sf http://localhost:9090/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ═══════════════════════════════════════════════════════════════════════════════
# USAGE EXAMPLES (copy-paste ready)
# ═══════════════════════════════════════════════════════════════════════════════
#
# 1. Create required bind-mount directories:
#    mkdir -p sandbox_volumes/{mobsf_data,mongodb_data,redis_data,pcap_output,reports,mitmproxy_data}
#
# 2. Create .env file with secrets:
#    cat > .env << 'EOF'
#    MONGO_PASSWORD=your_secure_mongo_password
#    REDIS_PASSWORD=your_secure_redis_password
#    MOBSF_API_KEY=your_mobsf_api_key_here
#    MOBSF_UI_PASSWORD=your_ui_password
#    EMULATOR_ADB_SERIAL=emulator-5554
#    TARGET_PACKAGE=com.target.malware.apk
#    NIRIKSHAK_BACKEND_URL=http://host.docker.internal:8001
#    EOF
#
# 3. Start sandbox:
#    docker compose -f dynamic_hooks/docker-compose.yml up -d
#
# 4. Upload APK and trigger dynamic scan:
#    curl -X POST http://localhost:8008/api/v1/upload \
#         -H "Authorization: ${MOBSF_API_KEY}" \
#         -F "file=@/path/to/malware.apk"
#
# 5. Run dynamic analysis:
#    curl -X POST http://localhost:8008/api/v1/dynamic/start_analysis \
#         -H "Authorization: ${MOBSF_API_KEY}" \
#         -d "hash=<apk_hash>&re_install=1&install=1&activity=1"
#
# 6. Attach Frida anti-evasion hooks:
#    frida -H 127.0.0.1:27042 -f com.target.app -l anti_evasion.js --no-pause
#
# 7. Stop dynamic analysis and get report:
#    curl -X POST http://localhost:8008/api/v1/dynamic/stop_analysis \
#         -H "Authorization: ${MOBSF_API_KEY}" \
#         -d "hash=<apk_hash>"
#
#    curl http://localhost:8008/api/v1/dynamic/report_json \
#         -H "Authorization: ${MOBSF_API_KEY}" \
#         -d "hash=<apk_hash>" > /tmp/report.json
#
# 8. Evaluate telemetry:
#    python dynamic_hooks/dynamic_analyzer.py \
#           /tmp/report.json \
#           sandbox_volumes/pcap_output/capture.pcapng
#
# 9. Tear down:
#    docker compose -f dynamic_hooks/docker-compose.yml down -v
